name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 0 minutes past the hour, every 2 hours — comfortable buffer under the 7-day inactivity window
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase (keep-alive)
        run: |
          curl -fsS \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/branches?select=id&limit=1"
